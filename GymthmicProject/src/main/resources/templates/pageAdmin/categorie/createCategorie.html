<!DOCTYPE html>
<html th:replace="base :: html" lang="fr" xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="content">
        <main class="py-5">
            <div class="container">
                <h1 class="mb-5 text-center">Création d'une nouvelle catégorie</h1>
                <form action="" method="post">
                    <div class="row">
                        <div class="my-2 mx-auto col-4">
                            <div class="mb-3">
                                <label for="inputNom"> Saisir le nom de la catégorie : </label>
                                <input id="inputNom" th:field="*{categorie.nom}" type="text" class="form-control">
                            </div>


                            <button type="submit"> Ajt </button>
                            <a th:href="@{'/GymthmicProject/admin/categories'}" type="submit" class="btn btn-outline-info">retour</a>
                        </div>

                    </div>
                </form>
            </div>
        </main>
    </div>
</html>
